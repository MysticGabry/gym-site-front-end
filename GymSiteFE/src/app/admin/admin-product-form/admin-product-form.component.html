<div class="admin-container">

  <div class="product-form-card">

    <h2 class="page-title">
      {{ isEdit ? '✏️ Modifica Prodotto' : '➕ Aggiungi Prodotto' }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="saveProduct()" class="product-form">

      <!-- NOME -->
      <div class="form-group">
        <label for="name">Nome</label>
        <input id="name" type="text" formControlName="name">
      </div>

      <!-- DESCRIZIONE -->
      <div class="form-group">
        <label for="description">Descrizione</label>
        <textarea id="description" formControlName="description"></textarea>
      </div>

      <!-- PREZZO -->
      <div class="form-group">
        <label for="price">Prezzo</label>
        <input id="price" type="number" formControlName="price">
      </div>

      <!-- STOCK -->
      <div class="form-group">
        <label for="stock">Stock</label>
        <input id="stock" type="number" formControlName="stock">
      </div>

      <!-- URL IMMAGINE -->
      <div class="form-group">
        <label for="imageUrl">Immagine (URL)</label>
        <input id="imageUrl" type="text" formControlName="imageUrl">
      </div>

      <!-- ANTEPRIMA IMMAGINE -->
      <div class="image-preview-box" *ngIf="form.value.imageUrl">
        <img
          [src]="form.value.imageUrl"
          alt="Anteprima immagine"
          class="preview-img"
        />
      </div>

      <button type="submit" class="submit-btn" [disabled]="form.invalid">
        {{ isEdit ? 'Aggiorna' : 'Crea' }}
      </button>

    </form>

  </div>

</div>
