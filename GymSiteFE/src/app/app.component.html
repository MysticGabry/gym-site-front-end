<nav class="navbar" *ngIf="showNavbar">

  <!-- LOGO -->
  <div class="nav-left">
    <a routerLink="/" class="logo">GymSite</a>
  </div>

  <div class="nav-right">

    <!-- LINK PRODOTTI SOLO SE NON È ADMIN -->
    <a *ngIf="!authService.isAdmin"
       routerLink="/products"
       routerLinkActive="active-link"
       class="nav-item">
      Prodotti
    </a>

    <!-- AREA ADMIN SOLO PER ADMIN -->
    <a *ngIf="authService.isAdmin"
       routerLink="/admin"
       routerLinkActive="active-link"
       class="nav-item admin-link">
      Area Admin
    </a>

    <!-- SE NON È LOGGATO -->
    <div *ngIf="!authService.isAuthenticated()" class="guest-links">
      <a routerLink="/login" class="nav-item">Login</a>
      <a routerLink="/register" class="nav-item register-btn">Registrati</a>
    </div>

    <!-- SE È LOGGATO -->
    <div *ngIf="authService.isAuthenticated()" class="user-menu" [class.open]="menuOpen">

      <button (click)="toggleMenu()" class="user-btn">
        👤 {{ username }}
        <span class="arrow"></span>
      </button>

      <div class="dropdown" *ngIf="menuOpen">

        <a routerLink="/profile" (click)="toggleMenu()">⚙️ Impostazioni</a>
        <a routerLink="/orders" (click)="toggleMenu()">📦 I miei ordini</a>

        <hr>

        <button class="logout-btn" (click)="onLogout()">🚪 Logout</button>

      </div>
    </div>

    <!-- CARRELLO SOLO PER UTENTI NORMALI -->
    <button *ngIf="!authService.isAdmin"
            class="cart-btn"
            routerLink="/cart">
      🛒
      <span class="cart-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </button>

  </div>
</nav>

<router-outlet></router-outlet>
