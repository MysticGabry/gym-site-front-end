<header class="gym-header">
  <nav class="navbar">
    <a routerLink="/" class="navbar-brand">
      <h1>{{ title }}</h1>
    </a>

    <div class="navbar-links">
      <a routerLink="/products" routerLinkActive="active">Prodotti</a>

      <div class="user-auth-section">
        <div *ngIf="authService.isLoggedIn" class="dropdown">
          <button class="dropbtn">
            👤 Account
          </button>
          <div class="dropdown-content">
            <a routerLink="/profile">Profilo</a>
            <a routerLink="/orders">I Miei Ordini</a>

            <ng-container *ngIf="authService.isAdmin">
              <hr>
              <a routerLink="/admin/products" routerLinkActive="active" class="admin-link">🛠️ Gestione Prodotti</a>
              <a routerLink="/admin/users" routerLinkActive="active" class="admin-link">Gestione Utenti</a>
            </ng-container>

            <hr>
            <a (click)="onLogout()">Logout</a>
          </div>
        </div>

        <ng-container *ngIf="!authService.isLoggedIn">
          <a routerLink="/login" routerLinkActive="active">Login</a>
          <a routerLink="/register" routerLinkActive="active">Registrati</a>
        </ng-container>

      </div>
    </div>
  </nav>
</header>

<main class="gym-content">
  <router-outlet></router-outlet>
</main>

<footer class="gym-footer">
  &copy; {{ 2025 }} GymSite
</footer>
