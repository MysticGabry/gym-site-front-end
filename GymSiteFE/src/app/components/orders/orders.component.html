<div class="orders-container">

  <h1>I miei ordini</h1>

  <div *ngIf="loading" class="loading">Caricamento...</div>

  <div *ngIf="!loading && orders.length === 0" class="empty">
    Nessun ordine presente.
  </div>

  <div *ngFor="let order of orders" class="order-card" (click)="openOrder(order.id)">
    <h2>Ordine #{{ order.id }}</h2>

    <p>📅 {{ order.createdAt | date:'short' }}</p>
    <p class="click">Clicca per vedere i dettagli →</p>
  </div>

</div>
