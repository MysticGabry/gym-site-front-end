<div class="product-catalog-header">
  <h2>Catalogo Prodotti</h2>
</div>

<div *ngIf="products$ | async as products; else loadingOrError">

  <div *ngIf="products.length > 0; else noProductsFound">

    <div class="product-grid">

      <!-- CARD CLICCABILE -->
      <div class="product-card"
           *ngFor="let product of products"
           [routerLink]="['/products', product.id]"
           style="cursor: pointer;">

        <div class="product-image-container">
          <img [src]="product.imageUrl || 'assets/placeholder.jpg'" [alt]="product.name">
        </div>

        <div class="product-details">
          <h3 class="product-name">{{ product.name }}</h3>
          <p class="product-description">{{ product.description }}</p>

          <div class="product-footer">
            <span class="product-price">€ {{ product.price | number:'1.2-2' }}</span>
            <span class="product-availability">Disponibilità: {{ product.stock || 0 }} pz.</span>
          </div>
        </div>

      </div>
      <!-- FINE CARD -->

    </div>
  </div>

</div>

<ng-template #loadingOrError>
  <p *ngIf="!(products$ | async)">Caricamento prodotti in corso...</p>
</ng-template>

<ng-template #noProductsFound>
  <div class="no-products">
    <h3>Nessun prodotto trovato.</h3>
    <p>Riprova più tardi o contatta l'amministratore per aggiungere articoli.</p>
  </div>
</ng-template>
