<div *ngIf="product" class="detail-container">

  <h1>{{ product.name }}</h1>

  <img [src]="product.imageUrl" class="detail-image" />

  <div class="info">
    <p><strong>Prezzo:</strong> {{ product.price | currency:'EUR' }}</p>
    <p><strong>Disponibilità:</strong> {{ product.stock }}</p>
  </div>

  <p class="description">{{ product.description }}</p>

  <!-- Utente loggato -->
  <div class="actions" *ngIf="authService.isAuthenticated() && !authService.isAdmin">
    <button class="btn-buy" (click)="buyNow(product)">Compra Subito</button>
    <button class="btn-cart" (click)="addToCart(product)">Aggiungi al Carrello</button>
  </div>

  <!-- Utente NON loggato -->
  <div class="actions" *ngIf="!authService.isAuthenticated()">
    <button class="btn-buy disabled" (click)="goToLogin()">Accedi per acquistare</button>
  </div>

</div>
