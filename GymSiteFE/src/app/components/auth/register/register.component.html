<div class="register-container">
  <h2>Crea il tuo Account</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <div class="form-group">
      <label for="username">Nome Utente</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Inserisci il tuo nome utente"
      />

      <div
        *ngIf="f['username'].invalid && f['username'].touched"
        class="error-message">
        <div *ngIf="f['username'].errors?.['required']">
          Il nome utente è obbligatorio.
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="es. mario.rossi@esempio.it"
      />

      <div
        *ngIf="f['email'].invalid && f['email'].touched"
        class="error-message">
        <div *ngIf="f['email'].errors?.['required']">
          L'indirizzo email è obbligatorio.
        </div>
        <div *ngIf="f['email'].errors?.['email']">
          L'indirizzo email non è valido.
        </div>
      </div>
    </div>

    <div class="form-group password-group">
      <label for="password">Password</label>
      <input
        id="password"
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
        placeholder="Inserisci la tua password"
      />

      <div
        *ngIf="f['password'].invalid && f['password'].touched"
        class="error-message">
        <div *ngIf="f['password'].errors?.['required']">
          La password è obbligatoria.
        </div>
        <div *ngIf="f['password'].errors?.['minlength'] || f['password'].errors?.['pattern']">
          La password deve essere di almeno 8 caratteri e contenere una maiuscola, una minuscola e un numero.
        </div>
      </div>
    </div>

    <button type="submit" [disabled]="registerForm.invalid" class="btn btn-primary">
      Registrati
    </button>
  </form>

  <p class="mt-3">
    Hai già un account? <a routerLink="/login">Accedi qui</a>
  </p>
</div>
