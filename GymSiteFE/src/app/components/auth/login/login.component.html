<div class="login-container">
  <h2>Accedi al tuo Account</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="utente@email.com"
      />

      <div
        *ngIf="f['email'].invalid && f['email'].touched"
        class="error-message">
        <div *ngIf="f['email'].errors?.['required']">
          L'indirizzo email è obbligatorio.
        </div>
        <div *ngIf="f['email'].errors?.['email']">
          L'indirizzo email non è valido.
        </div>
      </div>
    </div>

    <div class="form-group password-group">
      <label for="password">Password</label>

      <div class="password-wrapper">
        <input
          id="password"
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          placeholder="Inserisci la tua password"
        />

        <button
          type="button"
          class="toggle-password-icon"
          (click)="hidePassword = !hidePassword">
          <i class="fa" [ngClass]="hidePassword ? 'fa-eye' : 'fa-eye-slash'"></i>
        </button>
      </div>
    </div> <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">
    Accedi
  </button>
  </form>

  <p class="mt-3">
    Non hai un account? <a routerLink="/register">Registrati qui</a>
  </p>
</div>
