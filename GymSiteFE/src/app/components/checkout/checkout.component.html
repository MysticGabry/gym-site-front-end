<div class="checkout-wrapper">

  <div class="checkout-card" *ngIf="!success; else done">

    <h2>Pagamento</h2>

    <p class="total">
      Totale da pagare:
      <strong>{{ total | currency:'EUR' }}</strong>
    </p>

    <button class="pay-btn"
            (click)="confirmPayment()"
            [disabled]="processing">
      {{ processing ? '⏳ Elaborazione...' : 'Paga ora' }}
    </button>

  </div>

</div>

<ng-template #done>
  <div class="checkout-wrapper">
    <div class="checkout-card success">
      <h2>✔ Pagamento completato!</h2>
      <p>Stai venendo reindirizzato al catalogo...</p>
    </div>
  </div>
</ng-template>
